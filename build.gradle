    localRuntime "curse.maven:the-bumblezone-forge-362479:7875914" // 维度酒 - 蜜蜂领域
    localRuntime "maven.modrinth:aether:1.21.1-1.5.10-neoforge" // 维度酒 - 天境
    localRuntime "maven.modrinth:owo-lib:0.12.15.5-beta.1+1.21" // 维度酒 - 天境前置
    localRuntime "curse.maven:eternal-starlight-1080592:7788339" // 维度酒 - 永恒星光

    implementation "curse.maven:jei-238222:7420587" // jei
